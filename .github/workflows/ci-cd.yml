name: Banking Application CI/CDō


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        run: pytest -v

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::333534066864:role/GitHubActionsBankingDeployRole
          aws-region: ap-south-1

      - name: Deploy Application Through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-06aee4836b28fc7e6 \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["set -e","cd /home/ec2-user/banking-management-system","git pull --ff-only origin main","venv/bin/pip install -r requirements.txt","sudo systemctl restart banking","sudo systemctl is-active banking","curl -fsS -o /dev/null http://127.0.0.1/"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-06aee4836b28fc7e6

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-06aee4836b28fc7e6
